name: Keep Streamlit Alive

on:
  schedule:
    - cron: '0 */4 * * *' # Updated to run every 4 hours instead of 6
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Open App in Headless Browser
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import time

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              # UPDATE THIS URL TO YOUR EXACT APP LINK
              page.goto('https://comparisoninv.streamlit.app', timeout=60000)
              time.sleep(20)
              print('Successfully hydrated Streamlit app session!')
              browser.close()
          "
